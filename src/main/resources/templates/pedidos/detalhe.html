<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhe do Pedido - Pediu Patrão</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Botão para abrir/fechar a sidebar em telas pequenas -->
<div class="toggle-btn btn btn-dark d-md-none">
  <span>&#9776;</span>
</div>

<!-- Sidebar incluído como fragmento (mesmo padrão do layout.html) -->
<aside>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>
</aside>

<!-- Conteúdo Principal -->
<main class="container-fluid mt-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">
      <i class="bi bi-bag-check me-2 text-primary"></i>Detalhe do Pedido
    </h2>
    <a th:href="@{/pedidos}" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i> Voltar à Lista
    </a>
  </div>

  <!-- Dados do Pedido -->
  <div class="row g-4">
    <div class="col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header fw-bold">
          <i class="bi bi-info-circle me-1"></i>Informações do Pedido
        </div>
        <div class="card-body">
          <dl class="row mb-0">
            <dt class="col-sm-4 text-muted">ID</dt>
            <dd class="col-sm-8 small" th:text="${pedido.id}"></dd>

            <dt class="col-sm-4 text-muted">Cliente</dt>
            <dd class="col-sm-8 fw-semibold" th:text="${pedido.nomeCliente}"></dd>

            <dt class="col-sm-4 text-muted">Data</dt>
            <dd class="col-sm-8" th:text="${pedido.dataPedido != null} ? ${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')} : '-'"></dd>

            <dt class="col-sm-4 text-muted">Status</dt>
            <dd class="col-sm-8">
                            <span class="badge"
                                  th:classappend="${pedido.status.name() == 'FINALIZADO'} ? 'bg-success' :
                                                  (${pedido.status.name() == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status.name() == 'RECEBIDO'} ? 'bg-secondary' :
                                                  (${pedido.status.name() == 'EM_PREPARACAO'} ? 'bg-warning text-dark' :
                                                  (${pedido.status.name() == 'PRONTO'} ? 'bg-info text-dark' : 'bg-primary'))))"
                                  th:text="${pedido.status}">
                            </span>
            </dd>

            <dt class="col-sm-4 text-muted">Valor Total</dt>
            <dd class="col-sm-8 fw-bold"
                th:text="${pedido.valorTotal != null} ? 'R$ ' + ${#numbers.formatDecimal(pedido.valorTotal, 1, 2)} : '-'"></dd>

            <dt class="col-sm-4 text-muted">Desconto</dt>
            <dd class="col-sm-8">
                            <span th:if="${pedido.desconto != null}" class="badge bg-info text-dark"
                                  th:text="${pedido.desconto} + '%'"></span>
              <span th:if="${pedido.desconto == null}" class="text-muted">Nenhum</span>
            </dd>

            <dt class="col-sm-4 text-muted">Responsável</dt>
            <dd class="col-sm-8" th:text="${pedido.responsavelPeloRegistro != null} ? ${pedido.responsavelPeloRegistro} : '-'"></dd>

            <dt class="col-sm-4 text-muted">Observações</dt>
            <dd class="col-sm-8" th:text="${pedido.observacoes != null && !#strings.isEmpty(pedido.observacoes)} ? ${pedido.observacoes} : '-'"></dd>
          </dl>
        </div>
      </div>

      <!-- Itens do Pedido -->
      <div class="card shadow-sm mt-3" th:if="${!#lists.isEmpty(pedido.itens)}">
        <div class="card-header fw-bold">
          <i class="bi bi-list-ul me-1"></i>Itens do Pedido
        </div>
        <div class="card-body p-0">
          <table class="table table-sm mb-0">
            <thead class="table-light">
            <tr>
              <th class="ps-3">Produto</th>
              <th class="text-center">Qtd</th>
              <th class="text-end pe-3">Preço Unit.</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${pedido.itens}">
              <td class="ps-3" th:text="${item.nomeProduto}"></td>
              <td class="text-center" th:text="${item.quantidade}"></td>
              <td class="text-end pe-3" th:text="'R$ ' + ${#numbers.formatDecimal(item.precoUnitario, 1, 2)}"></td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Coluna de Ações -->
    <div class="col-lg-6">

      <!-- Formulário: Alterar Status (visível a todos autenticados) -->
      <!-- Backend garante que o fluxo de status seja respeitado via validarTransicaoDeStatus() -->
      <div class="card shadow-sm mb-3"
           th:if="${pedido.status.name() != 'FINALIZADO' && pedido.status.name() != 'CANCELADO'}">
        <div class="card-header fw-bold">
          <i class="bi bi-arrow-repeat me-1"></i>Alterar Status
        </div>
        <div class="card-body">
          <form th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post">
            <div class="mb-3">
              <label for="status" class="form-label">Novo Status</label>
              <select class="form-select" id="status" name="status" required>
                <option value="">Selecione...</option>
                <option th:each="s : ${statusOpcoes}"
                        th:value="${s.name()}"
                        th:text="${s.name()}"
                        th:selected="${s == pedido.status}">
                </option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-check2 me-1"></i>Confirmar Alteração
            </button>
          </form>
        </div>
      </div>

      <!-- Formulário: Cancelar Pedido (RF04 - exclusivo GERENTE) -->
      <div class="card shadow-sm border-danger mb-3" sec:authorize="hasRole('GERENTE')"
           th:if="${pedido.status.name() != 'FINALIZADO' && pedido.status.name() != 'CANCELADO'
                         && pedido.status.name() != 'SAIU_PARA_ENTREGA' && pedido.status.name() != 'RETIRADO'}">
        <div class="card-header fw-bold text-danger">
          <i class="bi bi-x-circle me-1"></i>Cancelar Pedido
        </div>
        <div class="card-body">
          <form th:action="@{/pedidos/{id}/cancelar(id=${pedido.id})}" method="post">
            <div class="mb-3">
              <label for="justificativa" class="form-label">Justificativa (obrigatória)</label>
              <textarea class="form-control" id="justificativa" name="justificativa"
                        rows="2" placeholder="Informe o motivo do cancelamento..." required></textarea>
            </div>
            <button type="submit" class="btn btn-danger w-100"
                    onclick="return confirm('Tem certeza que deseja cancelar este pedido?')">
              <i class="bi bi-x-circle me-1"></i>Cancelar Pedido
            </button>
          </form>
        </div>
      </div>

      <!-- Formulário: Aplicar Desconto (RF04 - exclusivo GERENTE) -->
      <div class="card shadow-sm border-warning mb-3" sec:authorize="hasRole('GERENTE')"
           th:if="${pedido.desconto == null
                         && pedido.status.name() != 'FINALIZADO' && pedido.status.name() != 'CANCELADO'}">
        <div class="card-header fw-bold text-warning">
          <i class="bi bi-percent me-1"></i>Aplicar Desconto
        </div>
        <div class="card-body">
          <form th:action="@{/pedidos/{id}/desconto(id=${pedido.id})}" method="post">
            <div class="mb-3">
              <label for="percentualDesconto" class="form-label">Percentual de Desconto (1% a 20%)</label>
              <div class="input-group">
                <input type="number" class="form-control" id="percentualDesconto"
                       name="percentualDesconto" min="1" max="20" step="1"
                       placeholder="Ex: 10" required>
                <span class="input-group-text">%</span>
              </div>
            </div>
            <button type="submit" class="btn btn-warning w-100">
              <i class="bi bi-percent me-1"></i>Aplicar Desconto
            </button>
          </form>
        </div>
      </div>

    </div>
  </div>

</main>

<script th:src="@{/js/script.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
