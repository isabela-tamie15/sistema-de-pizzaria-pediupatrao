<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Pediu Patrão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Botão para abrir/fechar a sidebar em telas pequenas -->
<div class="toggle-btn btn btn-dark d-md-none">
    <span>&#9776;</span>
</div>

<!-- Sidebar incluído como fragmento (mesmo padrão do layout.html) -->
<aside>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
</aside>

<!-- Conteúdo Principal -->
<main class="container-fluid mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a th:href="@{/pedidos/novo}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i> Novo Pedido
        </a>
    </div>

    <!-- Tabela de pedidos -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="ps-3">Cliente</th>
                    <th>Data</th>
                    <th>Status</th>
                    <th class="text-end">Valor Total</th>
                    <th class="text-end pe-3">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(pedidos)}">
                    <td colspan="5" class="text-center text-muted py-4">Nenhum pedido encontrado.</td>
                </tr>
                <tr th:each="pedido : ${pedidos}">
                    <td class="ps-3 fw-semibold" th:text="${pedido.nomeCliente}"></td>
                    <td th:text="${pedido.dataPedido != null} ? ${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')} : '-'"></td>
                    <td>
                            <span class="badge"
                                  th:classappend="${pedido.status.name() == 'FINALIZADO'} ? 'bg-success' :
                                                  (${pedido.status.name() == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status.name() == 'RECEBIDO'} ? 'bg-secondary' :
                                                  (${pedido.status.name() == 'EM_PREPARACAO'} ? 'bg-warning text-dark' :
                                                  (${pedido.status.name() == 'PRONTO'} ? 'bg-info text-dark' : 'bg-primary'))))"
                                  th:text="${pedido.status}">
                            </span>
                    </td>
                    <td class="text-end"
                        th:text="${pedido.valorTotal != null} ? 'R$ ' + ${#numbers.formatDecimal(pedido.valorTotal, 1, 2)} : '-'">
                    </td>
                    <td class="text-end pe-3">
                        <a th:href="@{/pedidos/{id}(id=${pedido.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-eye me-1"></i>Detalhe
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<script th:src="@{/js/script.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
