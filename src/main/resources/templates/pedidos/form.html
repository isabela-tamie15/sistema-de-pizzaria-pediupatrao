<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Pedido - Pediu Patrão</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Botão para abrir/fechar a sidebar em telas pequenas -->
<div class="toggle-btn btn btn-dark d-md-none"><span>&#9776;</span></div>

<!-- Sidebar incluído como fragmento -->
<aside>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>
</aside>

<!-- Conteúdo Principal -->
<main class="container-fluid mt-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">
      <i class="bi bi-bag-plus me-2 text-primary"></i>Novo Pedido
    </h2>
    <a th:href="@{/pedidos}" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i> Voltar
    </a>
  </div>

  <div class="card shadow-sm" style="max-width: 700px;">
    <div class="card-body p-4">

      <!-- th:action aponta para POST /pedidos/salvar -->
      <!-- th:object liga os campos do formulário ao objeto Pedido do controller -->
      <form th:action="@{/pedidos/salvar}" th:object="${pedido}" method="post">

        <!-- CORREÇÃO: dropdown de clientes cadastrados em vez de texto livre -->
        <div class="mb-3">
          <label for="nomeCliente" class="form-label fw-semibold">Cliente</label>
          <select class="form-select" id="nomeCliente" name="nomeCliente" required>
            <option value="">Selecione o cliente...</option>
            <!-- th:each percorre a lista de clientes enviada pelo controller -->
            <!-- th:value e th:text usam o nome do cliente, pois Pedido armazena nomeCliente (String) -->
            <option th:each="c : ${clientes}"
                    th:value="${c.nome}"
                    th:text="${c.nome}">
            </option>
          </select>
        </div>

        <!-- Observações -->
        <div class="mb-3">
          <label for="observacoes" class="form-label fw-semibold">Observações</label>
          <textarea class="form-control" id="observacoes" th:field="*{observacoes}"
                    rows="2" placeholder="Ex: Sem cebola, borda recheada..."></textarea>
        </div>

        <hr>
        <h6 class="fw-bold mb-3"><i class="bi bi-list-ul me-1"></i>Itens do Pedido</h6>

        <!-- Lista de itens — cada linha tem índice itens[N] para o Thymeleaf mapear na lista do Pedido -->
        <div id="itens-container">
          <!-- Primeira linha de item (índice 0) -->
          <div class="row g-2 mb-2 item-row">
            <div class="col-md-5">
              <!-- CORREÇÃO: dropdown de produtos cadastrados; ao selecionar, preenche o preço automaticamente -->
              <select class="form-select produto-select" name="itens[0].nomeProduto" required
                      onchange="preencherPreco(this, 0)">
                <option value="">Produto...</option>
                <option th:each="p : ${produtos}"
                        th:value="${p.nome}"
                        th:text="${p.nome}"
                        th:attr="data-preco=${p.preco}">
                </option>
              </select>
            </div>
            <div class="col-md-3">
              <input type="number" class="form-control" name="itens[0].quantidade"
                     min="1" value="1" placeholder="Qtd" required
                     oninput="calcularTotal()">
            </div>
            <div class="col-md-3">
              <!-- Preço preenchido automaticamente ao selecionar o produto -->
              <input type="number" class="form-control preco-input" id="preco-0"
                     name="itens[0].precoUnitario" step="0.01" min="0" placeholder="Preço" required>
            </div>
            <div class="col-md-1 d-flex align-items-center">
              <!-- Botão remover linha (desabilitado na primeira — sempre precisa de ao menos 1 item) -->
              <button type="button" class="btn btn-outline-danger btn-sm" onclick="removerItem(this)" disabled>
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Botão para adicionar mais itens -->
        <button type="button" class="btn btn-outline-secondary btn-sm mb-3" onclick="adicionarItem()">
          <i class="bi bi-plus-lg me-1"></i>Adicionar Item
        </button>

        <!-- RF02: total calculado ao vivo no formulário; o servidor recalcula e persiste no banco -->
        <!-- valorTotal NÃO está no formulário como campo oculto: calculado no servidor pelo PedidoService (RF02) -->
        <div class="mb-4 text-end">
          <strong>Total do Pedido: R$ <span id="totalPedido">0,00</span></strong>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">
            <i class="bi bi-check-circle me-2"></i>Salvar Pedido
          </button>
        </div>

      </form>
    </div>
  </div>

</main>

<script th:inline="javascript">
  /*<![CDATA[*/

  // CORREÇÃO: declarado aqui dentro do th:inline="javascript" para que o Thymeleaf
  // processe a expressão [[${produtos}]] e injete a lista real do servidor.
  // Se declarado fora deste bloco, o Thymeleaf ignora e produtos fica [] sempre.
  const produtos = /*[[${produtos}]]*/ [];

  // Índice do próximo item a ser adicionado (começa em 1, pois o índice 0 já existe no HTML)
  let proximoIndice = 1;

  // Preenche o campo de preço automaticamente quando o usuário seleciona um produto
  // data-preco é o atributo th:attr definido na option acima com o preço do produto
  function preencherPreco(select, indice) {
    const option = select.options[select.selectedIndex];
    const preco = option.getAttribute('data-preco') || '';
    document.getElementById('preco-' + indice).value = preco;
    calcularTotal();
  }

  // Adiciona uma nova linha de item clonando a estrutura da primeira linha
  // Atualiza os índices dos campos name (itens[N].nomeProduto, itens[N].quantidade, itens[N].precoUnitario)
  function adicionarItem() {
    const container = document.getElementById('itens-container');
    const indice = proximoIndice++;

    // Monta o HTML da nova linha com os índices corretos
    const linha = document.createElement('div');
    linha.className = 'row g-2 mb-2 item-row';
    linha.innerHTML = `
      <div class="col-md-5">
        <select class="form-select" name="itens[${indice}].nomeProduto" required
                onchange="preencherPreco(this, ${indice})">
          <option value="">Produto...</option>
          ${gerarOptions()}
        </select>
      </div>
      <div class="col-md-3">
        <input type="number" class="form-control" name="itens[${indice}].quantidade"
               min="1" value="1" placeholder="Qtd" required
               oninput="calcularTotal()">
      </div>
      <div class="col-md-3">
        <input type="number" class="form-control" id="preco-${indice}"
               name="itens[${indice}].precoUnitario" step="0.01" min="0" placeholder="Preço" required>
      </div>
      <div class="col-md-1 d-flex align-items-center">
        <button type="button" class="btn btn-outline-danger btn-sm" onclick="removerItem(this)">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    `;
    container.appendChild(linha);
    calcularTotal();
  }

  // Gera as <option> de produtos para linhas adicionadas dinamicamente
  // Usa o array 'produtos' injetado pelo Thymeleaf acima
  function gerarOptions() {
    return produtos.map(p =>
      `<option value="${p.nome}" data-preco="${p.preco}">${p.nome}</option>`
    ).join('');
  }

  // Remove a linha de item clicada e recalcula o total
  function removerItem(btn) {
    btn.closest('.item-row').remove();
    calcularTotal();
  }

  // RF02: calcula o total ao vivo somando quantidade * precoUnitario de cada linha
  // O servidor recalcula e persiste o valorTotal final no PedidoService
  function calcularTotal() {
    let total = 0;
    document.querySelectorAll('#itens-container .item-row').forEach(linha => {
      const qtd   = parseFloat(linha.querySelector('[name$=".quantidade"]').value)      || 0;
      const preco = parseFloat(linha.querySelector('[name$=".precoUnitario"]').value)   || 0;
      total += qtd * preco;
    });
    document.getElementById('totalPedido').textContent =
      total.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  /*]]>*/
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
