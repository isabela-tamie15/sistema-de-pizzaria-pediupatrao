<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoria - Pediu Patrão</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="toggle-btn btn btn-dark d-md-none">
  <span>&#9776;</span>
</div>

<aside>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>
</aside>

<main class="container-fluid mt-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">
      <i class="bi bi-journal-text me-2 text-primary"></i>Auditoria
    </h2>
  </div>

  <!-- Filtros -->
  <div class="row g-3 mb-4">
    <div class="col-md-5">
      <form th:action="@{/auditoria}" method="get" class="d-flex gap-2">
        <input type="text" class="form-control" name="usuarioResponsavel"
               th:value="${filtroUsuario}" placeholder="Filtrar por usuário...">
        <button type="submit" class="btn btn-outline-primary">
          <i class="bi bi-search"></i>
        </button>
      </form>
    </div>
    <div class="col-md-5">
      <form th:action="@{/auditoria}" method="get" class="d-flex gap-2">
        <input type="text" class="form-control" name="acao"
               th:value="${filtroAcao}" placeholder="Filtrar por ação (ex: PEDIDO_CRIADO)...">
        <button type="submit" class="btn btn-outline-secondary">
          <i class="bi bi-search"></i>
        </button>
      </form>
    </div>
    <div class="col-md-2">
      <a th:href="@{/auditoria}" class="btn btn-outline-danger w-100">
        <i class="bi bi-x-circle me-1"></i>Limpar
      </a>
    </div>
  </div>

  <!-- Tabela de registros -->
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover table-sm mb-0">
        <thead class="table-dark">
        <tr>
          <th class="ps-3">Data/Hora</th>
          <th>Ação</th>
          <th>Entidade ID</th>
          <th>Descrição</th>
          <th>Valor Anterior</th>
          <th>Valor Novo</th>
          <th>Justificativa</th>
          <th class="pe-3">Usuário</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(registros)}">
          <td colspan="8" class="text-center text-muted py-4">Nenhum registro de auditoria encontrado.</td>
        </tr>
        <tr th:each="registro : ${registros}">
          <td class="ps-3 small text-nowrap"
              th:text="${registro.dataHora != null} ? ${#temporals.format(registro.dataHora, 'dd/MM/yy HH:mm')} : '-'">
          </td>
          <td>
                            <span class="badge"
                                  th:classappend="${registro.acao != null && registro.acao.contains('CRIADO')} ? 'bg-success' :
                                                  (${registro.acao != null && registro.acao.contains('EXCLUIDO')} ? 'bg-danger' :
                                                  (${registro.acao != null && registro.acao.contains('CANCELADO')} ? 'bg-danger' :
                                                  (${registro.acao != null && registro.acao.contains('DESCONTO')} ? 'bg-warning text-dark' : 'bg-secondary')))"
                                  th:text="${registro.acao}">
                            </span>
          </td>
          <td class="small text-muted" th:text="${registro.entidadeId}"></td>
          <td class="small" th:text="${registro.descricao}"></td>
          <td class="small text-muted" th:text="${registro.valorAnterior != null} ? ${registro.valorAnterior} : '-'"></td>
          <td class="small" th:text="${registro.valorNovo != null} ? ${registro.valorNovo} : '-'"></td>
          <td class="small text-warning" th:text="${registro.justificativa != null} ? ${registro.justificativa} : '-'"></td>
          <td class="pe-3 small fw-semibold" th:text="${registro.usuarioResponsavel}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<script th:src="@{/js/script.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
