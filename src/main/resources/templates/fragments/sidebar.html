<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div th:fragment="sidebar">
    <div id="sidebar">

        <!-- Logo -->
        <div class="sidebar-brand">
            <img th:src="@{/images/logo.svg}" alt="PediuPatrão" style="width: 100%; max-width: 200px; display: block; margin: 0 auto;">
        </div>

        <ul class="nav flex-column px-2">

            <!-- Home -->
            <li class="nav-item">
                <a class="nav-link sidebar-link" th:href="@{/}"
                   th:classappend="${currentUri == '/'} ? ' active'">
                    <i class="bi bi-house-fill me-2"></i>
                    <span class="d-none d-md-inline">Home</span>
                </a>
            </li>

            <!-- Clientes -->
            <li class="nav-item">
                <a class="nav-link sidebar-link" th:href="@{/clientes}"
                   th:classappend="${currentUri.startsWith('/clientes')} ? ' active'">
                    <i class="bi bi-person-raised-hand me-2"></i>
                    <span class="d-none d-md-inline">Clientes</span>
                </a>
            </li>

            <!-- Pedidos -->
            <li class="nav-item">
                <a class="nav-link sidebar-link" th:href="@{/pedidos}"
                   th:classappend="${currentUri.startsWith('/pedidos')} ? ' active'">
                    <i class="bi bi-bag-fill me-2"></i>
                    <span class="d-none d-md-inline">Pedidos</span>
                </a>
            </li>

            <!-- Produtos — movido para o nav principal (era submenu de Configurações) -->
            <li class="nav-item">
                <a class="nav-link sidebar-link" th:href="@{/produtos}"
                   th:classappend="${currentUri.startsWith('/produtos')} ? ' active'">
                    <i class="bi bi-basket me-2"></i>
                    <span class="d-none d-md-inline">Produtos</span>
                </a>
            </li>

            <!-- Auditoria - visível apenas para ADMIN e GERENTE (RF05) -->
            <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'GERENTE')">
                <a class="nav-link sidebar-link" th:href="@{/auditoria}"
                   th:classappend="${currentUri.startsWith('/auditoria')} ? ' active'">
                    <i class="bi bi-journal-text me-2"></i>
                    <span class="d-none d-md-inline">Auditoria</span>
                </a>
            </li>

            <!-- Divisor -->
            <li><hr class="sidebar-divider"></li>
            <li class="sidebar-section-label d-none d-md-block"></li>
            <!-- Configurações com submenu -->
            <li class="nav-item" id="menu-configuracoes">
                <a class="nav-link sidebar-link d-flex justify-content-between align-items-center"
                   href="#">
                    <span>
                        <i class="bi bi-gear-fill me-2"></i>
                        <span class="d-none d-md-inline">Minha Pizzaria</span>
                    </span>

                </a>
                <ul class="nav flex-column submenu" style="display: block !important;">
                    <li class="nav-item">
                        <a class="nav-link sidebar-link sidebar-sublink" th:href="@{/funcionarios}"
                           th:classappend="${currentUri.startsWith('/funcionarios')} ? ' active'">
                            <i class="bi bi-person-walking me-2"></i>
                            <span class="d-none d-md-inline">Funcionários</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link sidebar-link sidebar-sublink" th:href="@{/entregadores}"
                           th:classappend="${currentUri.startsWith('/entregadores')} ? ' active'">
                            <i class="bi bi-bicycle me-2"></i>
                            <span class="d-none d-md-inline">Entregadores</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link sidebar-link sidebar-sublink" th:href="@{/horarios}"
                           th:classappend="${currentUri.startsWith('/horarios')} ? ' active'">
                            <i class="bi bi-clock-fill me-2"></i>
                            <span class="d-none d-md-inline">Horários</span>
                        </a>
                    </li>
                </ul>
            </li>

            <!-- Divisor -->
            <li><hr class="sidebar-divider"></li>

            <!-- Logout -->
            <li class="nav-item">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="nav-link sidebar-link btn btn-link text-start w-100 border-0">
                        <i class="bi bi-box-arrow-right me-2"></i>
                        <span class="d-none d-md-inline">Sair</span>
                    </button>
                </form>
            </li>

        </ul>

        <!-- Rodapé -->
        <div class="sidebar-footer d-none d-md-block">
            <i class="bi bi-circle-fill text-success me-1" style="font-size: 0.5rem;"></i>
            Sistema online
        </div>

    </div>
</div>

<style>
    #sidebar {
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: linear-gradient(180deg, #1e2330 0%, #252d3d 100%);
        border-right: 1px solid rgba(255,255,255,0.06);
    }

    .sidebar-brand {
        padding: 1rem 1rem 0.5rem;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        margin-bottom: 0.5rem;
    }

    .sidebar-link {
        color: rgba(255,255,255,0.6) !important;
        border-radius: 8px;
        padding: 0.55rem 0.85rem;
        margin-bottom: 2px;
        font-size: 0.9rem;
        transition: all 0.2s ease;
    }

    .sidebar-link:hover {
        background-color: rgba(255,255,255,0.08) !important;
        color: #fff !important;
    }

    .sidebar-link.active {
        background-color: rgba(255, 107, 53, 0.18) !important;
        color: #ff6b35 !important;
        font-weight: 500;
    }

    .sidebar-sublink {
        font-size: 0.85rem;
        padding-left: 1.2rem;
    }

    .sidebar-divider {
        border-color: rgba(255,255,255,0.08);
        margin: 0.4rem 0.5rem;
    }

    .sidebar-section-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: rgba(255,255,255,0.3);
        padding: 0.2rem 1rem 0.4rem;
    }

    .submenu-arrow {
        font-size: 0.7rem;
        transition: transform 0.2s;
        color: rgba(255,255,255,0.3);
    }

    .nav-item.open .submenu-arrow {
        transform: rotate(180deg);
    }

    .sidebar-footer {
        margin-top: auto;
        padding: 1rem 1.2rem;
        font-size: 0.78rem;
        color: rgba(255,255,255,0.3);
        border-top: 1px solid rgba(255,255,255,0.06);
    }
</style>
</body>
</html>
