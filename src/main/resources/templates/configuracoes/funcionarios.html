<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionários - Pediu Patrão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="toggle-btn btn btn-dark d-md-none"><span>&#9776;</span></div>
<aside>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
</aside>
<main class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-person-badge me-2 text-primary"></i>Funcionários
        </h2>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>Nome</th>
                    <th>Cargo</th>
                    <th>Turno</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>Carlos Souza</td>
                    <td>Atendente</td>
                    <td>Manhã</td>
                    <td><span class="badge bg-success">Ativo</span></td>
                </tr>
                <tr>
                    <td>Maria Oliveira</td>
                    <td>Caixa</td>
                    <td>Tarde</td>
                    <td><span class="badge bg-success">Ativo</span></td>
                </tr>
                <tr>
                    <td>João Lima</td>
                    <td>Cozinheiro</td>
                    <td>Integral</td>
                    <td><span class="badge bg-secondary">Inativo</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
