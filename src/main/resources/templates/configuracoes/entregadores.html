<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entregadores - Pediu Patrão</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="toggle-btn btn btn-dark d-md-none"><span>&#9776;</span></div>
<aside>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>
</aside>
<main class="container-fluid mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">
      <i class="bi bi-bicycle me-2 text-primary"></i>Entregadores
    </h2>
  </div>
  <div class="card shadow-sm">
    <div class="card-body">
      <table class="table table-hover align-middle">
        <thead class="table-dark">
        <tr>
          <th>Nome</th>
          <th>Veículo</th>
          <th>Telefone</th>
          <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr>
          <td>Pedro Alves</td>
          <td>Moto</td>
          <td>(11) 99999-1111</td>
          <td><span class="badge bg-success">Disponível</span></td>
        </tr>
        <tr>
          <td>Lucas Mendes</td>
          <td>Bicicleta</td>
          <td>(11) 99999-2222</td>
          <td><span class="badge bg-warning text-dark">Em entrega</span></td>
        </tr>
        <tr>
          <td>Rafael Costa</td>
          <td>Moto</td>
          <td>(11) 99999-3333</td>
          <td><span class="badge bg-secondary">Inativo</span></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
